<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thurgh · Sheet de Bateria</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090F;--surface:#12121C;--card:#1C1C2A;--border:#252535;
  --text:#E8E2D0;--muted:#6B6B84;--accent:#7C5CFC;--fs:18px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.hidden{display:none!important}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
input{font-family:inherit}

/* ── UPLOAD ──────────────────────────────────────── */
#screen-upload{height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#1a103a 0%,var(--bg) 70%)}
.up-wrap{text-align:center;max-width:480px;padding:24px;width:100%}
.up-logo{font-size:52px;font-weight:900;letter-spacing:5px;
  text-shadow:0 0 60px rgba(124,92,252,.7);margin-bottom:4px}
.up-sub{color:var(--muted);font-size:12px;letter-spacing:3px;
  text-transform:uppercase;margin-bottom:36px}
.drop-zone{border:2px dashed var(--border);border-radius:14px;
  padding:44px 28px;transition:border-color .2s,background .2s;position:relative}
.drop-zone.drag-over{border-color:var(--accent);background:rgba(124,92,252,.09)}
.drop-icon{font-size:38px;margin-bottom:14px;display:block;opacity:.7}
.drop-text{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:18px}
#file-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-btn{display:inline-block;background:var(--accent);color:#fff;
  padding:10px 28px;border-radius:8px;font-size:14px;font-weight:600;
  position:relative;z-index:1;pointer-events:none}
.up-tip{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.6}
.up-tip b{color:#9a9ab8}
#up-err{margin-top:14px;color:#EF4444;font-size:13px;padding:10px 16px;
  background:rgba(239,68,68,.12);border-radius:8px;display:none}

/* ── LIST ────────────────────────────────────────── */
#screen-list{height:100vh;display:flex;flex-direction:column}
.list-head{padding:12px 16px 10px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0}
.list-head-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.list-title{font-size:16px;font-weight:700;flex:1;color:var(--text)}
.pill-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;
  border:1.5px solid var(--border);color:var(--muted);transition:all .18s;letter-spacing:.2px}
.pill-btn:hover{border-color:var(--muted);color:var(--text)}
.pill-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-wrap{position:relative}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  opacity:.3;font-size:13px;pointer-events:none}
.search-in{width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px 8px 32px;color:var(--text);
  font-size:14px;outline:none;transition:border-color .15s}
.search-in:focus{border-color:var(--accent)}
#song-list{flex:1;overflow-y:auto}
.song-item{display:flex;align-items:center;gap:0;padding:13px 16px;
  cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border)}
.song-item:hover{background:rgba(255,255,255,.04)}
.song-info{flex:1;min-width:0}
.song-name{font-size:15px;font-weight:500;line-height:1.3;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text)}
.song-name.is-fav{color:#f0c040}
.song-meta{font-size:11px;color:var(--muted);margin-top:3px}
.fav-btn{font-size:20px;padding:2px 8px;color:var(--muted);
  transition:color .15s,transform .12s;flex-shrink:0}
.fav-btn.active{color:#EAB308}
.fav-btn:hover{transform:scale(1.2)}
.list-foot{padding:8px 16px;background:var(--surface);
  border-top:1px solid var(--border);font-size:11px;color:var(--muted);
  text-align:center;flex-shrink:0}
.empty-msg{text-align:center;padding:60px 24px;color:var(--muted);
  font-size:14px;line-height:2}

/* ── SONG VIEW ───────────────────────────────────── */
#screen-song{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.song-hd{padding:10px 14px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;gap:8px;min-height:48px}
.back-btn{padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600;
  background:var(--card);border:1px solid var(--border);flex-shrink:0;
  transition:border-color .15s;white-space:nowrap}
.back-btn:hover{border-color:var(--muted)}
.song-hd-title{flex:1;font-size:15px;font-weight:700;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;color:var(--text)}
.hd-fav-btn{font-size:20px;padding:2px 6px;color:var(--muted);
  flex-shrink:0;transition:color .15s}
.hd-fav-btn.active{color:#EAB308}
.font-grp{display:flex;gap:3px;flex-shrink:0}
.font-btn{width:30px;height:28px;border-radius:5px;font-size:13px;font-weight:700;
  background:var(--card);border:1px solid var(--border);transition:background .12s}
.font-btn:hover{background:var(--border)}

/* Legend strip */
.legend-strip{display:flex;flex-wrap:wrap;gap:5px;padding:6px 14px;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;min-height:32px;align-items:center}
.leg-pill{display:flex;align-items:center;gap:4px;padding:2px 7px;
  border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.3px}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Song body - EXCEL-LIKE flat rows */
#song-body{flex:1;overflow-y:auto;overflow-x:hidden}
#song-body::-webkit-scrollbar{width:5px}
#song-body::-webkit-scrollbar-track{background:var(--bg)}
#song-body::-webkit-scrollbar-thumb{background:#333}

.section{margin-bottom:6px}

/* Annotation row - colored like Excel cell highlight */
.ann-row{
  display:flex;flex-direction:column;padding:8px 14px;
  font-family:'Courier New',Courier,monospace;
  font-weight:700;font-size:14px;line-height:1.5;
  word-break:break-word;gap:1px
}
.ann-type{font-weight:700}
.ann-note{font-weight:400;font-size:13px;opacity:.88;line-height:1.4}
.ann-sub{
  padding:5px 14px 5px 20px;
  font-family:'Courier New',Courier,monospace;
  font-weight:600;font-size:13px;line-height:1.4;opacity:.9
}

/* Lyric rows */
.lyric-row{
  padding:5px 14px;
  font-size:var(--fs);line-height:1.75;
  color:var(--text);background:var(--card);
  border-left:3px solid var(--sec-color,#374151)
}
.lyric-row:last-child{padding-bottom:6px}

/* Spacer between sections */
.sec-gap{height:8px;background:transparent}

/* ── PLAYBAR ──────────────────────────────────────── */
.playbar{
  background:var(--surface);border-top:1px solid var(--border);
  padding:9px 14px;flex-shrink:0
}
.pb-row{display:flex;align-items:center;gap:9px}
.pb-stop{width:38px;height:38px;border-radius:7px;font-size:14px;
  background:var(--card);border:1px solid var(--border);
  flex-shrink:0;transition:background .12s}
.pb-stop:hover{background:var(--border)}
.pb-play{width:50px;height:38px;border-radius:7px;font-size:18px;
  background:var(--accent);color:#fff;flex-shrink:0;
  transition:opacity .12s;font-weight:700}
.pb-play:hover{opacity:.85}
.dur-grp{display:flex;flex-direction:column;align-items:center;
  gap:2px;flex-shrink:0}
.dur-in{background:var(--card);border:1px solid var(--border);
  border-radius:5px;padding:5px 7px;color:var(--text);
  font-size:15px;font-weight:700;font-family:'Courier New',monospace;
  width:66px;text-align:center;outline:none;transition:border-color .12s}
.dur-in:focus{border-color:var(--accent)}
.dur-lbl{font-size:9px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.prog-grp{flex:1;display:flex;flex-direction:column;gap:4px}
.prog-bar{height:7px;background:var(--border);border-radius:4px;
  overflow:hidden;cursor:pointer;position:relative}
.prog-fill{height:100%;background:var(--accent);width:0%;
  transition:width .08s linear;border-radius:4px}
.prog-times{display:flex;justify-content:space-between;
  font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<!-- ══ UPLOAD ════════════════════════════════════════ -->
<div id="screen-upload">
  <div class="up-wrap">
    <div class="up-logo">THURGH</div>
    <div class="up-sub">Sheet de Bateria</div>
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".csv">
      <span class="drop-icon">🥁</span>
      <div class="drop-text">
        Arraste o arquivo <strong>.CSV</strong> aqui, ou clique para selecionar
      </div>
      <span class="drop-btn">Selecionar arquivo</span>
    </div>
    <div class="up-tip">
      Dica: renomeie o CSV para <b>musicas.csv</b> e coloque
      na mesma pasta do <b>thurgh-sheet.html</b> — o app vai abrir sozinho.
    </div>
    <div id="up-err"></div>
  </div>
</div>

<!-- ══ LIST ══════════════════════════════════════════ -->
<div id="screen-list" class="hidden">
  <div class="list-head">
    <div class="list-head-row">
      <span class="list-title">Lista de Músicas</span>
      <button class="pill-btn" id="week-btn" onclick="toggleWeek()">★ Semana</button>
      <button class="pill-btn" onclick="goUpload()">📁 Arquivo</button>
    </div>
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input class="search-in" id="search-in" type="text"
        placeholder="Buscar…" oninput="renderList()">
    </div>
  </div>
  <div id="song-list"></div>
  <div class="list-foot" id="list-foot"></div>
</div>

<!-- ══ SONG ══════════════════════════════════════════ -->
<div id="screen-song" class="hidden">
  <div class="song-hd">
    <button class="back-btn" onclick="goList()">← Voltar</button>
    <span class="song-hd-title" id="hd-title"></span>
    <button class="hd-fav-btn" id="hd-fav" onclick="toggleFavSong()">☆</button>
    <div class="font-grp">
      <button class="font-btn" onclick="adjFs(-2)" title="Diminuir">−</button>
      <button class="font-btn" onclick="adjFs(+2)" title="Aumentar">+</button>
    </div>
  </div>
  <div class="legend-strip" id="legend"></div>
  <div id="song-body"></div>
  <div class="playbar">
    <div class="pb-row">
      <button class="pb-stop" id="stop-btn" onclick="stopPlay()" title="Reiniciar">⏮</button>
      <button class="pb-play" id="play-btn" onclick="togglePlay()">▶</button>
      <div class="dur-grp">
        <input class="dur-in" id="dur-in" type="text" value="3:30">
        <span class="dur-lbl">Duração</span>
      </div>
      <div class="prog-grp">
        <div class="prog-bar" onclick="seekClick(event)">
          <div class="prog-fill" id="prog-fill"></div>
        </div>
        <div class="prog-times">
          <span id="pb-el">0:00</span>
          <span id="pb-rem"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── GLOBALS ────────────────────────────────────────────
let songs=[], favs=new Set(), cur=null;
let fs=18, weekMode=false;
// Playback state
let playing=false, rafId=null;
let ps=null; // {startTime, startScroll, totalScroll, durSec, speed}

// ── DRUM COLORS (matching Excel palette) ───────────────
// Pausa          → amarelo claro
// Marcação/Acentuação/Bumbo/Virada → salmão claro
// Ride/Crescente/Pratos → coral/vermelho
// Surdo/Tribal   → lilás
// HiHat          → verde
// Aro            → verde-amarelado
// Caixa          → azul-ciano
const _TX='#111';
const COLS=[
  {k:'hihat',     re:/hi[-\s]?hat|chimbal/i,            bg:'#33CC33',tx:_TX,label:'HiHat'},
  {k:'pausa',     re:/\bpausa\b/i,                       bg:'#FFFF99',tx:_TX,label:'Pausa'},
  {k:'tribal',    re:/tribal/i,                          bg:'#CC99DD',tx:_TX,label:'Tribal'},
  {k:'surdo',     re:/\bsurdo\b/i,                       bg:'#CC99DD',tx:_TX,label:'Surdo'},
  {k:'ride',      re:/\bride\b/i,                        bg:'#FF7777',tx:_TX,label:'Ride'},
  {k:'caixa',     re:/\bcaixa\b/i,                       bg:'#33CCEE',tx:_TX,label:'Caixa'},
  {k:'bumbo',     re:/\bbumbo\b/i,                       bg:'#FFAAAA',tx:_TX,label:'Bumbo'},
  {k:'marcacao',  re:/marca[çc][aã]o|marcacao/i,         bg:'#FFAAAA',tx:_TX,label:'Marcação'},
  {k:'acentuacao',re:/acent/i,                           bg:'#FFAAAA',tx:_TX,label:'Acentuação'},
  {k:'crescente', re:/crescente/i,                       bg:'#FF7777',tx:_TX,label:'Crescente'},
  {k:'aro',       re:/\baro\b/i,                         bg:'#AACC55',tx:_TX,label:'Aro'},
  {k:'virada',    re:/virada/i,                          bg:'#FFAAAA',tx:_TX,label:'Virada'},
  {k:'pratos',    re:/\bprato/i,                         bg:'#FF7777',tx:_TX,label:'Pratos'},
  {k:'default',   re:/(?:)/,                             bg:'#D0D0D0',tx:_TX,label:''}
];
function getCol(ann){
  for(const c of COLS){if(c.re.test(ann)) return c;}
  return COLS[COLS.length-1];
}

// ── CSV PARSE ──────────────────────────────────────────
function parseCSV(raw){
  const rows=raw.split(/\r?\n/).map(r=>r.split(';'));
  if(rows.length<12) throw new Error('Arquivo inválido ou muito curto.');
  // Find song name row (most non-empty, non-bracket cells)
  let nameRow=10,best=0;
  for(let r=0;r<Math.min(20,rows.length);r++){
    const n=rows[r].filter(c=>c.trim()&&!c.trim().startsWith('[')).length;
    if(n>best){best=n;nameRow=r;}
  }
  const cols=[];
  (rows[nameRow]||[]).forEach((cell,i)=>{
    const n=cell.trim();
    if(n&&!n.startsWith('[')) cols.push({name:n,i});
  });
  if(!cols.length) throw new Error('Nenhuma música encontrada. CSV deve usar ; como separador.');
  const start=nameRow+2;
  return cols.map(({name,i})=>{
    const blocks=[];
    let anns=[],lyrics=[];
    const flush=()=>{
      if(anns.length||lyrics.length){blocks.push({anns:[...anns],lyrics:[...lyrics]});anns=[];lyrics=[];}
    };
    for(let r=start;r<rows.length;r++){
      const cell=(i<(rows[r]||[]).length?rows[r][i]:'').trim();
      if(!cell){flush();continue;}
      if(cell.startsWith('[')){if(lyrics.length) flush();anns.push(cell);}
      else lyrics.push(cell);
    }
    flush();
    // Dominant color
    const cnt={};
    blocks.forEach(b=>{const k=getCol(b.anns[0]||'').bg;cnt[k]=(cnt[k]||0)+1;});
    const dom=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]||'#374151';
    return {name,col:i,blocks,dom};
  });
}

// ── STORAGE ────────────────────────────────────────────
function saveAll(){
  try{
    localStorage.setItem('thurgh_favs',JSON.stringify([...favs]));
    localStorage.setItem('thurgh_fs',String(fs));
    localStorage.setItem('thurgh_week',weekMode?'1':'0');
    localStorage.setItem('thurgh_songs',JSON.stringify(songs));
  }catch(e){}
}
function loadStore(){
  try{
    const f=localStorage.getItem('thurgh_favs');if(f)favs=new Set(JSON.parse(f));
    const fz=localStorage.getItem('thurgh_fs');if(fz)fs=parseInt(fz)||18;
    const wk=localStorage.getItem('thurgh_week');if(wk)weekMode=wk==='1';
    const s=localStorage.getItem('thurgh_songs');
    if(s){songs=JSON.parse(s);return true;}
  }catch(e){}
  return false;
}

// ── SCREENS ────────────────────────────────────────────
function show(id){
  ['screen-upload','screen-list','screen-song'].forEach(s=>
    document.getElementById(s).classList.toggle('hidden',s!==id)
  );
}
function goUpload(){stopPlay();show('screen-upload');}
function goList(){stopPlay();show('screen-list');renderList();}
function goSong(s){if(!s)return;cur=s;show('screen-song');renderSong();}

// ── FILE LOADING ───────────────────────────────────────
function decodeBuffer(buf){
  let text;
  try{text=new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(buf));}
  catch(e){text=new TextDecoder('iso-8859-1').decode(new Uint8Array(buf));}
  return text;
}
function processText(text){
  songs=parseCSV(text);
  if(!songs.length) throw new Error('Nenhuma música encontrada.');
  saveAll(); goList();
}
function readFile(file){
  const err=document.getElementById('up-err');
  err.style.display='none';
  if(!file||!file.name.toLowerCase().endsWith('.csv')){
    err.textContent='Selecione um arquivo .CSV';err.style.display='block';return;
  }
  const reader=new FileReader();
  reader.onload=e=>{
    try{processText(decodeBuffer(e.target.result));}
    catch(ex){err.textContent=ex.message;err.style.display='block';}
  };
  reader.readAsArrayBuffer(file);
}

// Auto-load from same directory
async function tryAutoLoad(){
  const names=['./musicas.csv','./Thurgh_IBAV_.csv','./thurgh.csv','./sheet.csv'];
  for(const url of names){
    try{
      const res=await fetch(url,{cache:'no-store'});
      if(res.ok){
        const buf=await res.arrayBuffer();
        const text=decodeBuffer(buf);
        songs=parseCSV(text);
        if(songs.length){saveAll();goList();return;}
      }
    }catch(e){}
  }
}

// ── FAVORITES ──────────────────────────────────────────
function toggleFav(name){
  favs.has(name)?favs.delete(name):favs.add(name);
  saveAll();renderList();
  if(cur?.name===name) syncFavBtn();
}
function toggleFavSong(){if(cur){toggleFav(cur.name);syncFavBtn();}}
function syncFavBtn(){
  const on=favs.has(cur?.name);
  const btn=document.getElementById('hd-fav');
  btn.textContent=on?'★':'☆';
  btn.classList.toggle('active',on);
}
function toggleWeek(){
  weekMode=!weekMode;saveAll();
  document.getElementById('week-btn').classList.toggle('active',weekMode);
  renderList();
}

// ── LIST ───────────────────────────────────────────────
function renderList(){
  document.getElementById('week-btn').classList.toggle('active',weekMode);
  const q=(document.getElementById('search-in').value||'').toLowerCase().trim();

  // Sort: favorites first, then alphabetical
  const sorted=[...songs].sort((a,b)=>{
    const af=favs.has(a.name)?0:1, bf=favs.has(b.name)?0:1;
    if(af!==bf) return af-bf;
    return a.name.localeCompare(b.name,'pt');
  });

  const list=sorted.filter(s=>{
    if(weekMode&&!favs.has(s.name)) return false;
    return !q||s.name.toLowerCase().includes(q);
  });

  const el=document.getElementById('song-list');
  if(!list.length){
    el.innerHTML=`<div class="empty-msg">${weekMode
      ?'Nenhuma música favorita.<br>Toque ☆ para salvar as músicas da semana.'
      :'Nenhuma música encontrada.'}</div>`;
  } else {
    el.innerHTML=list.map(s=>{
      const si=songs.indexOf(s), isFav=favs.has(s.name);
      return `<div class="song-item" data-si="${si}">
        <div class="song-info">
          <div class="song-name${isFav?' is-fav':''}">${esc(s.name)}</div>
          <div class="song-meta">${s.blocks.length} blocos</div>
        </div>
        <button class="fav-btn${isFav?' active':''}" data-si="${si}">${isFav?'★':'☆'}</button>
      </div>`;
    }).join('');
    el.querySelectorAll('.song-item').forEach(row=>{
      row.addEventListener('click',e=>{
        if(e.target.classList.contains('fav-btn'))return;
        goSong(songs[+row.dataset.si]);
      });
    });
    el.querySelectorAll('.fav-btn').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        toggleFav(songs[+btn.dataset.si].name);
      });
    });
  }
  const total=songs.length,nFav=favs.size;
  document.getElementById('list-foot').textContent=
    `${total} músicas · ${nFav} favorita${nFav!==1?'s':''}`;
}

// ── SONG RENDER ────────────────────────────────────────
function esc(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Split "[TYPE] optional (note)" annotation
function splitAnn(ann){
  // Find the last ] and check if there's extra text after it
  const lb=ann.lastIndexOf(']');
  if(lb>=0&&lb<ann.length-1){
    const after=ann.substring(lb+1).trim();
    if(after) return {type:ann.substring(0,lb+1), note:after};
  }
  return {type:ann,note:''};
}

function renderSong(){
  if(!cur) return;
  document.documentElement.style.setProperty('--fs',fs+'px');
  document.getElementById('hd-title').textContent=cur.name;
  syncFavBtn();

  // Legend: unique drum types in this song
  const seen=new Map();
  cur.blocks.forEach(b=>{
    const c=getCol(b.anns[0]||'');
    if(c.label&&!seen.has(c.label)) seen.set(c.label,c);
  });
  document.getElementById('legend').innerHTML=
    [...seen.values()].map(c=>
      `<span class="leg-pill" style="background:${c.bg}20">
        <span class="leg-dot" style="background:${c.bg}"></span>
        <span style="color:${c.bg}">${c.label}</span>
      </span>`
    ).join('');

  // Build flat-row Excel-like layout
  let html='';
  cur.blocks.forEach((b,bi)=>{
    const c=getCol(b.anns[0]||'');
    html+='<div class="section">';
    // Each annotation gets its own colored row
    b.anns.forEach((ann,ai)=>{
      const ac=getCol(ann);
      const {type,note}=splitAnn(ann);
      html+=`<div class="ann-row" style="background:${ac.bg};color:${ac.tx}">
        <span class="ann-type">${esc(type)}</span>
        ${note?`<span class="ann-note">${esc(note)}</span>`:''}
      </div>`;
    });
    // Lyric rows
    b.lyrics.forEach(l=>{
      html+=`<div class="lyric-row" style="--sec-color:${c.bg}">${esc(l)}</div>`;
    });
    html+='</div>';
    if(bi<cur.blocks.length-1) html+='<div class="sec-gap"></div>';
  });

  const body=document.getElementById('song-body');
  body.innerHTML=html;
  body.scrollTop=0;
  resetProg();
}

function adjFs(d){
  fs=Math.max(12,Math.min(30,fs+d));
  document.documentElement.style.setProperty('--fs',fs+'px');
  saveAll();
}

// ── PLAYBACK ───────────────────────────────────────────
function parseDur(s){
  s=(s||'3:30').trim();
  const p=s.split(':');
  if(p.length===2) return Math.max(1,parseInt(p[0]||0)*60+parseInt(p[1]||0));
  return Math.max(1,parseFloat(s)*60||210);
}
function fmt(sec){
  sec=Math.max(0,Math.round(sec));
  return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
}
function resetProg(){
  document.getElementById('prog-fill').style.width='0%';
  document.getElementById('pb-el').textContent='0:00';
  document.getElementById('pb-rem').textContent='';
}
function updateProg(pct,durSec){
  pct=Math.max(0,Math.min(1,pct));
  document.getElementById('prog-fill').style.width=(pct*100).toFixed(1)+'%';
  document.getElementById('pb-el').textContent=fmt(pct*durSec);
  document.getElementById('pb-rem').textContent='-'+fmt((1-pct)*durSec);
}

function togglePlay(){playing?pausePlay():startPlay();}

function startPlay(){
  const body=document.getElementById('song-body');
  if(!body) return;

  // Recalculate scrollable height (content may have changed)
  const total=body.scrollHeight-body.clientHeight;
  if(total<10){
    // Content doesn't scroll — nothing to do
    return;
  }

  const dur=parseDur(document.getElementById('dur-in').value);

  // If at bottom, restart from top
  if(body.scrollTop>=total-4) body.scrollTop=0;

  const curY=body.scrollTop;
  const frac=total>0?curY/total:0;
  const timeLeft=Math.max(0.5,dur*(1-frac));
  const dist=total-curY;

  // Store absolute playback state
  ps={
    startTime:performance.now(),
    startScroll:curY,
    totalScroll:total,
    durSec:dur,
    speed:dist/timeLeft   // px/s
  };

  playing=true;
  document.getElementById('play-btn').textContent='⏸';
  if(rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(rafLoop);
}

function pausePlay(){
  playing=false;
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  document.getElementById('play-btn').textContent='▶';
}

function stopPlay(){
  pausePlay();
  const body=document.getElementById('song-body');
  if(body) body.scrollTop=0;
  ps=null;
  resetProg();
}

function rafLoop(now){
  if(!playing||!ps) return;
  const body=document.getElementById('song-body');
  if(!body){playing=false;return;}

  const elapsed=(now-ps.startTime)/1000;
  const newY=ps.startScroll+ps.speed*elapsed;
  body.scrollTop=newY;

  const pct=ps.totalScroll>0?newY/ps.totalScroll:0;
  updateProg(pct,ps.durSec);

  if(newY>=ps.totalScroll-1){
    pausePlay();
    updateProg(1,ps.durSec);
    return;
  }
  rafId=requestAnimationFrame(rafLoop);
}

function seekClick(e){
  const bar=document.getElementById('prog-fill').parentElement;
  const rect=bar.getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  const body=document.getElementById('song-body');
  if(!body) return;
  const total=body.scrollHeight-body.clientHeight;
  body.scrollTop=pct*total;
  const dur=parseDur(document.getElementById('dur-in').value);
  updateProg(pct,dur);
  if(playing){
    // Recalculate from new position
    pausePlay();
    startPlay();
  }
}

// ── INIT ───────────────────────────────────────────────
(async function init(){
  // Drag-drop
  const dz=document.getElementById('drop-zone');
  ['dragenter','dragover'].forEach(ev=>
    document.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag-over');})
  );
  document.addEventListener('dragleave',e=>{
    if(!dz.contains(e.relatedTarget)) dz.classList.remove('drag-over');
  });
  document.addEventListener('drop',e=>{
    e.preventDefault();dz.classList.remove('drag-over');
    readFile(e.dataTransfer.files[0]);
  });
  document.getElementById('file-input').addEventListener('change',e=>{
    if(e.target.files[0]) readFile(e.target.files[0]);
  });

  // Load saved state first (fast)
  loadStore();

  // Try auto-loading from disk (async, won't block)
  // Works when served via HTTP; silently ignored on file://
  const autoLoaded=new Promise(async resolve=>{
    try{ await tryAutoLoad(); }catch(e){}
    resolve();
  });

  // Show list if we have songs from localStorage, otherwise upload screen
  if(songs.length){
    goList();
  } else {
    // Wait briefly for auto-load attempt
    await Promise.race([autoLoaded, new Promise(r=>setTimeout(r,800))]);
    if(!songs.length) show('screen-upload');
  }
})();
</script>
